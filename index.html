<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="index,follow">
    <title>سياسة الخصوصية | Privacy Policy — Basira</title>
    <meta name="description" content="سياسة خصوصية تطبيق بَصيرة | اتّزانك الرقمي | Basira Privacy Policy">
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Tahoma, sans-serif;
            background: #FDF8F0;
            color: #1C1B1F;
            padding: 24px;
        }
        .card {
            background: #FFFFFF;
            border-radius: 24px;
            padding: 48px 36px;
            max-width: 520px;
            width: 100%;
            box-shadow: 0 4px 24px rgba(93, 64, 55, 0.08);
            text-align: center;
        }
        .brand {
            font-size: 32px;
            font-weight: 700;
            color: #D4A853;
            margin: 0 0 8px;
        }
        .subtitle {
            font-size: 14px;
            color: #5D4037;
            margin: 0 0 32px;
            opacity: 0.7;
        }
        h2 {
            font-size: 18px;
            color: #5D4037;
            margin: 0 0 20px;
            font-weight: 600;
        }
        .lang-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }
        a.btn {
            display: block;
            padding: 18px 12px;
            border-radius: 14px;
            background: #FAF3E8;
            color: #5D4037;
            text-decoration: none;
            font-weight: 600;
            font-size: 16px;
            transition: all 0.15s ease;
            border: 1px solid transparent;
        }
        a.btn:hover {
            background: #D4A853;
            color: #FFFFFF;
            transform: translateY(-1px);
        }
        a.btn small {
            display: block;
            font-weight: 400;
            font-size: 12px;
            margin-top: 4px;
            opacity: 0.7;
        }
        .footer {
            margin-top: 32px;
            font-size: 12px;
            color: #8B6B61;
        }
        .footer a {
            color: #D4A853;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <main class="card">
        <h1 class="brand">بَصيرة</h1>
        <p class="subtitle">اتّزانك الرقمي · Digital Balance</p>
        <h2>اختر اللغة · Choose language</h2>
        <nav class="lang-grid">
            <a class="btn" href="./ar.html" hreflang="ar">العربية<small>سياسة الخصوصية</small></a>
            <a class="btn" href="./en.html" hreflang="en">English<small>Privacy Policy</small></a>
        </nav>
        <p class="footer">
            تواصل · Contact: <a href="mailto:abdulrhman.qt@gmail.com">abdulrhman.qt@gmail.com</a>
        </p>

</body>
</html>
